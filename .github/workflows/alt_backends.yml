name: alt_backends
# Test the alternative container backends (podman, singularity, udocker), which take a while and
# need extra setup on the runner. Manual workflow_dispatch only: run before a release and after
# touching the container backend code.
on:
  workflow_dispatch:

jobs:

  backend:
    strategy:
      fail-fast: false
      matrix:
        backend:
          - podman
          - singularity
          - udocker
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: checkout bash-tap submodule
      run: |
        # (only submodule these tests need)
        git submodule update --init --depth 1 tests/bash-tap
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: install miniwdl dependencies
      run: |
        python3 -m pip install .
    - name: install podman
      if: ${{ matrix.backend == 'podman' }}
      run: |
        # podman is preinstalled on GitHub-hosted Ubuntu runners; miniwdl defaults to running it
        # with passwordless sudo, which the runners also provide.
        sudo -n podman --version
    - name: install singularity
      if: ${{ matrix.backend == 'singularity' }}
      run: |
        # Apptainer (Singularity successor) from its PPA, which also provides the `singularity`
        # command and an AppArmor profile permitting the unprivileged user namespaces it uses.
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt-get -qq update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y apptainer
        singularity --version
    - name: install udocker
      if: ${{ matrix.backend == 'udocker' }}
      run: |
        python3 -m pip install udocker
        udocker install
        udocker --version
    - name: prove -v tests/${{ matrix.backend }}.t
      run: |
        prove -v tests/${{ matrix.backend }}.t
