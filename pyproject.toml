[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniwdl"
dynamic = ["version"]
description = "Workflow Description Language (WDL) local runner & developer toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CZI", email = "security@chanzuckerberg.com"}
]
urls = { "Homepage" = "https://github.com/chanzuckerberg/miniwdl" }
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Interpreters"
]
dependencies = [
    "regex>=2020.4.4",
    "xdg>=5.0.0",
    "docker>=3.4.0",
    "ruamel.yaml~=0.19",
    "argcomplete>=3,<4",
    "coloredlogs>=15,<16",
    "python-json-logger>=3.1,<5",
    "lark~=1.3",
    "questionary>=2,<3",
    "psutil>=5,<8",
    "pathspec>=0.12"
]

[project.optional-dependencies]
dev = [
    "ruff~=0.17.0",  # 0.16 expanded the default rule set (see #906)
    "mypy",
    "pytest",
    "testfixtures",
    "pytest-xdist",
    "pytest-cov",
    "coverage",
    "python-coveralls",
    "build",
    "wheel",
    "twine",
    "sphinx",
    "sphinx-autobuild",
    "furo",
    "sphinx-argparse",
    "myst-parser",
    "sphinx-copybutton",
    "graphviz",
    "boto3"
]

[project.scripts]
miniwdl = "WDL.CLI:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["WDL"]

[tool.setuptools_scm]
write_to = "WDL/_version.py"

[tool.mypy]
mypy_path = "${MYPY_CONFIG_FILE_DIR}/stubs"

[tool.ruff]
line-length = 100
exclude = ["WDL/_version.py"]

[tool.ruff.lint]
ignore = [
    "N999",    # CapWords module names (WDL.Tree, WDL.Error, ...) are the public API
    "INT001",  # presumes `_` is gettext; here `_` is StructuredLogMessage
    "PYI034",  # fix requires typing.Self (py3.11+); floor is 3.10
    "B009",    # dynamic attrs are a deliberate idiom (exception/AST decoration, probing)
    "B010",    # ditto B009; direct access breaks mypy on undeclared attrs
    "BLE001",  # broad catches are deliberate containment at runner boundaries
    "D419",    # """""" is the autodoc exclusion marker, not a placeholder
]
